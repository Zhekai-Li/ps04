  .card { background:#FFFFFF; border:1pt solid #CDD2D3; border-radius:2pt; }

  .tint { background:#E7EFEE; border:1pt solid #E7EFEE; border-radius:2pt; }

  .dark { background:#182433; border:1pt solid #182433; border-radius:2pt; }
